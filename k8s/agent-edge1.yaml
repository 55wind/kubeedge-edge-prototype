# 원본: prototype-y1/k8s/agent-edge1.yaml (Apache-2.0, 사내 1차년도 산출물)
# 수정 요약: (1) 이미지 eam-agent:v2 (본 repo Dockerfile.agent 빌드)로 교체,
#            실행 커맨드를 실제 존재하는 `python -m eam.agent` 엔트리로 교체
#            (2) AMQP 자격증명(하드코딩 비밀번호) 제거 - RabbitMQ 데이터플레인은
#            선택 사항으로 분리(k8s/rabbitmq.yaml 참고)
#            (3) 사설IP 하드코딩(1차년도 고정 클라우드 노드 IP) 제거 -> __CLOUD_IP__ 플레이스홀더
#            (deploy/demo-setup-v2.sh가 sed로 치환)
#            (4) nodeSelector를 KubeEdge edge 노드 라벨(node-role.kubernetes.io/edge)
#            기준으로 변경 - 1차년도는 K3s nodeName으로 직접 스케줄했으나, 본
#            산출물은 KubeEdge 연동 구조(수행항목 4·7)를 보이기 위해 edge 라벨
#            셀렉터를 사용한다
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-001
  namespace: edge-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-001
  template:
    metadata:
      labels:
        app: agent-001
    spec:
      nodeSelector:
        node-role.kubernetes.io/edge: ""
      containers:
        - name: agent
          image: eam-agent:v2
          imagePullPolicy: Never
          command: ["python", "-m", "eam.agent"]
          env:
            - name: DEVICE_ID
              value: "agent-001"
            - name: DEVICE_SITE
              value: "factory-A"
            - name: DEVICE_GROUP
              value: "sensors"
            - name: MANAGER_BASE_URL
              value: "http://__CLOUD_IP__:30443"
            - name: BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: eam-secrets
                  key: bootstrap-token
            - name: CERTS_DIR
              value: "/certs"
            - name: AGENT_BUFFER_DIR
              value: "/buffer"
            - name: AGENT_SENSOR_TYPE
              value: "temperature"
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: certs
              mountPath: /certs
            - name: buffer
              mountPath: /buffer
      volumes:
        - name: certs
          emptyDir: {}
        - name: buffer
          emptyDir: {}
