# 원본: prototype-y1/k8s/manager.yaml (Apache-2.0, 사내 1차년도 산출물)
# 수정 요약: (1) 이미지 eam-manager:v2 (본 repo Dockerfile.manager 빌드)로 교체
#            (2) 비밀번호/토큰 하드코딩 제거 -> Secret(eam-secrets) 참조로 전환
#                (Secret은 deploy/demo-setup-v2.sh가 openssl rand로 매 배포 시 생성)
#            (3) INSECURE_MODE/AUTO_APPROVE를 평문 env로 노출해 보안 적용 전/후
#                시연 시 값만 바꿔 재배포할 수 있게 함
#            (4) manager는 자체 TLS를 하지 않음(uvicorn 평문 HTTP) - "TLS는 서비스
#                앞단"이라는 과제 요구에 따라 실제 mTLS 종단은 리버스 프록시 계층의
#                몫으로 남기고, 여기서는 KubeEdge cloud 노드 컨테이너 자체의 mTLS
#                인증서 볼륨 마운트를 생략함(1차년도 대비 단순화)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manager
  namespace: edge-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: manager
  template:
    metadata:
      labels:
        app: manager
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: manager
          image: eam-manager:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 8443
          env:
            - name: CERTS_DIR
              value: "/certs"
            - name: DB_URL
              value: "/data/manager.db"
            # 보안 적용 "전" 시연 시 true로, "후" 시연 시 false로 재배포해 비교한다.
            - name: INSECURE_MODE
              value: "false"
            - name: AUTO_APPROVE
              value: "true"
            - name: BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: eam-secrets
                  key: bootstrap-token
            - name: EAM_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: eam-secrets
                  key: admin-username
            - name: EAM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eam-secrets
                  key: admin-password
            - name: EAM_OPERATOR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: eam-secrets
                  key: operator-username
            - name: EAM_OPERATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eam-secrets
                  key: operator-password
          volumeMounts:
            - name: data
              mountPath: /data
            - name: certs
              mountPath: /certs
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: data
          emptyDir: {}
        - name: certs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: manager
  namespace: edge-auth
spec:
  type: NodePort
  selector:
    app: manager
  ports:
    - name: http
      port: 8443
      targetPort: 8443
      nodePort: 30443
