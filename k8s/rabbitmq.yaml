# 원본: prototype-y1/k8s/rabbitmq.yaml (Apache-2.0, 사내 1차년도 산출물)
# 수정 요약: (1) definitions.json에 박혀 있던 계정/비밀번호 하드코딩 제거 -
#            rabbitmq:3.13-management 이미지
#            표준 기동 env인 RABBITMQ_DEFAULT_USER/RABBITMQ_DEFAULT_PASS로 대체하고
#            그 값은 Secret(rabbitmq-secrets, deploy/demo-setup-v2.sh가 openssl
#            rand로 매 배포 시 생성)에서 주입한다. definitions.json은 계정 없이
#            vhost/큐 정의만 남긴다.
#            (2) TLS 리스너 설정(rabbitmq.conf의 listeners.ssl.*)은 1차년도 구조를
#            그대로 유지 - 인증서는 여전히 rabbitmq-certs Secret에서 마운트한다.
#
# 본 리소스는 "선택 사항(optional)" 데이터플레인 예시다: 현재 eam 패키지의
# Manager/Agent/Gateway는 AMQP를 전혀 사용하지 않으며(REST + mTLS + JWT/JWS만
# 사용), 이 매니페스트는 1차년도 대비 메시지 브로커 계층을 어떻게 자리매김할 수
# 있는지 보여주기 위한 참고용 배포다. `kubectl apply -f k8s/rabbitmq.yaml`을
# 생략해도 manager/agent/gateway 데모 전체 흐름에는 아무 영향이 없다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: edge-auth
data:
  rabbitmq.conf: |
    listeners.tcp = none
    listeners.ssl.default = 5671
    ssl_options.cacertfile = /etc/rabbitmq/certs/ca.crt
    ssl_options.certfile   = /etc/rabbitmq/certs/server.crt
    ssl_options.keyfile    = /etc/rabbitmq/certs/server.key
    ssl_options.verify     = verify_peer
    ssl_options.fail_if_no_peer_cert = true
    management.listener.port = 15672
    management.load_definitions = /etc/rabbitmq/definitions.json
    loopback_users.guest = false
    vm_memory_high_watermark.absolute = 256MB
  definitions.json: |
    {
      "vhosts": [{"name": "/"}],
      "queues": [
        {"name": "agent.metadata", "vhost": "/", "durable": true, "auto_delete": false, "arguments": {}}
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: edge-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5671
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: password
          volumeMounts:
            - name: config
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
            - name: config
              mountPath: /etc/rabbitmq/definitions.json
              subPath: definitions.json
            - name: rabbitmq-certs
              mountPath: /etc/rabbitmq/certs
              readOnly: true
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: config
          configMap:
            name: rabbitmq-config
        - name: rabbitmq-certs
          secret:
            secretName: rabbitmq-certs
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: edge-auth
spec:
  type: NodePort
  selector:
    app: rabbitmq
  ports:
    - name: amqps
      port: 5671
      targetPort: 5671
      nodePort: 30671
    - name: management
      port: 15672
      targetPort: 15672
      nodePort: 30672
