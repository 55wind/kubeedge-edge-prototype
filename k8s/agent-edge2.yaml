# 원본: prototype-y1/k8s/agent-edge2.yaml (Apache-2.0, 사내 1차년도 산출물)
# 수정 요약: agent-edge1.yaml과 동일 (device_id/site/센서 종류만 상이) - 상세
# 수정 사유는 agent-edge1.yaml 헤더 주석 참고.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-002
  namespace: edge-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-002
  template:
    metadata:
      labels:
        app: agent-002
    spec:
      nodeSelector:
        node-role.kubernetes.io/edge: ""
      containers:
        - name: agent
          image: eam-agent:v2
          imagePullPolicy: Never
          command: ["python", "-m", "eam.agent"]
          env:
            - name: DEVICE_ID
              value: "agent-002"
            - name: DEVICE_SITE
              value: "factory-B"
            - name: DEVICE_GROUP
              value: "sensors"
            - name: MANAGER_BASE_URL
              value: "http://__CLOUD_IP__:30443"
            - name: BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: eam-secrets
                  key: bootstrap-token
            - name: CERTS_DIR
              value: "/certs"
            - name: AGENT_BUFFER_DIR
              value: "/buffer"
            - name: AGENT_SENSOR_TYPE
              value: "humidity"
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: certs
              mountPath: /certs
            - name: buffer
              mountPath: /buffer
      volumes:
        - name: certs
          emptyDir: {}
        - name: buffer
          emptyDir: {}
